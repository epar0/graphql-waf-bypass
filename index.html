<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphQL Unicode Encoder</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f4f6f9; color: #333; position: relative; min-height: 90vh; }
        textarea { width: 100%; height: 180px; margin: 10px 0; padding: 10px; box-sizing: border-box; font-family: monospace; border: 1px solid #ccc; border-radius: 4px; word-break: break-all; overflow-wrap: anywhere; }
        button { background: #10b981; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        button:hover { background: #059669; }
        .btn-copy { background: #3b82f6; float: right; padding: 6px 14px; font-size: 13px; width: auto; margin-top: -5px; }
        .btn-copy:hover { background: #2563eb; }
        .output-box { background: #fff; padding: 15px; border-radius: 4px; border: 1px solid #ddd; margin-top: 20px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        h3 { margin: 0 0 10px 0; }
        footer { margin-top: 40px; text-align: center; font-size: 13px; color: #666; font-weight: bold; line-height: 1.6; }
        footer .author { font-weight: bold; font-size: 14px; color: #333; }
        footer a { color: #10b981; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>GraphQL Unicode Encoder</h1>
    <p>Paste your GraphQL query below. This tool converts the query into a fully Unicode-escaped JSON request's'.</p>

    <h3>1. Enter GraphQL Query</h3>
    <textarea id="inputQuery" placeholder="query IntrospectionQuery {
  __schema {
    queryType {
      name
    }
    mutationType {
      name
    }
    subscriptionType {
      name
    }
    types {
      kind
      name
      description
    }
    directives {
      name
      description
      locations
    }
  }
}"></textarea>

    <button onclick="encodeGraphQL()">Generate Unicoded GraphQL Query</button>

    <div class="output-box">
        <div class="header-row">
            <h3>2. Resulting Unicode-Escaped JSON:</h3>
            <button onclick="copyOutput()" id="copyBtn" class="btn-copy">Kopioi Tulos</button>
        </div>
        <textarea id="outputJson" readonly placeholder='{"query": "..."}'></textarea>
    </div>

    <footer>
        <div class="author">made by eparo</div>
        <div><a href="mailto:eparotest675@gmail.com">eparotest675@gmail.com</a></div>
    </footer>

    <script>
        function encodeGraphQL() {
            const rawQuery = document.getElementById('inputQuery').value;
            if (!rawQuery.trim()) {
                document.getElementById('outputJson').value = "Please enter a GraphQL query first!";
                return;
            }

            let cleanQuery = rawQuery;
            
            // If input is already a JSON payload, extract only the query content
            if (rawQuery.trim().startsWith('{')) {
                try {
                    const parsed = JSON.parse(rawQuery);
                    if (parsed.query) cleanQuery = parsed.query;
                } catch(e) {}
            }

            // Convert ALL characters to \uXXXX
            let unicodeEscapedQuery = "";
            for (let i = 0; i < cleanQuery.length; i++) {
                let charCode = cleanQuery.charCodeAt(i);
                let hex = charCode.toString(16).padStart(4, '0');
                unicodeEscapedQuery += "\\u" + hex;
            }

            const escapedForJson = unicodeEscapedQuery.replace(/"/g, '\\"');
            const rawJsonString = '{\n  "query": "' + escapedForJson + '"\n}';

            // Update output field
            document.getElementById('outputJson').value = rawJsonString;
        }

        function copyOutput() {
            const outputArea = document.getElementById('outputJson');
            if (!outputArea.value) return;

            outputArea.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copyBtn');
            btn.innerText = 'Kopioitu!';
            setTimeout(() => { btn.innerText = 'Kopioi Tulos'; }, 2000);
        }
    </script>

</body>
</html>
